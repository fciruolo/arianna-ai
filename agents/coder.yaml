# Coder (docs/AGENT-CARDS.md): Claude Code or Codex on L0/L1 code, the local
# model on L2 code. In the cloud the private data side is removed by
# cloud_max_label (the router and the gateway enforce it); locally the
# external communication side is removed.
name: coder
description: Writes and changes code in a worktree, with tests
max_label: L2
cloud_max_label: L1
executors: [claude, codex, local]
tools: [repo.read, repo.write, repo.test, task.update, user.ask]
# D-261: on Claude Code only, through Arianna's MCP server, within L1 and the
# task's clearance; the local steps do not read the knowledge base.
# D-262: web.fetch reads a public page the user wrote in the request or of a
# site of [web] coder_sites, through the gateway, at most 10 per run.
cloud_tools: [kb.search, kb.read, web.fetch]
trifecta:
  private_data: true
  # Repositories, dependencies and issue text are not trusted.
  untrusted_content: true
  external_comms: false
autonomy: A1
difficulty: normal
limits: { max_steps: 50, max_minutes: 45, max_cost: 0 }
approvals: []
prompt: coder.md
