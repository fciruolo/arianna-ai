# Arianna configuration. No secrets in this file (docs/INSTALLER-PORTABILITY.md).
# Every path is relative to ARIANNA_HOME; absolute paths are rejected.

[paths]
# Models, databases, archive, real knowledge base, vault. Never in git.
data = "data"

[database]
# PostgreSQL in Docker, reachable only from this machine.
host = "127.0.0.1"
port = 54329
name = "arianna"
user = "arianna"

# Local inference (task 1.3): OpenAI-compatible servers on this machine only,
# because requests carry L2 data in clear. Endpoints in order of preference:
# the first is the main one, the others are fallbacks. `command` is optional:
# with it the watchdog can restart the server; without it, it only monitors.
# Model names are copied by hand from the server until the installer (task 1.17).
# The server is oMLX (github.com/jundot/omlx). Relative paths in `command` are
# relative to ARIANNA_HOME. Model names are the ones `GET /v1/models` returns
# (folder name or alias). Do not also run it as a Homebrew service: the
# watchdog would only adopt it, without being able to restart it.
#
# [[local.endpoints]]
# id = "omlx"
# url = "http://127.0.0.1:8000/v1"
# command = ["omlx", "serve", "--model-dir", "data/models", "--host", "127.0.0.1", "--port", "8000"]
# models = { "local-large" = "<model name>", "local-small" = "<model name>" }

# Repositories Claude Code and Codex may work on (task 1.6), relative to
# ARIANNA_HOME. Each needs a [[folder]] rule of at most L1 in labels.toml:
# allowlisting a repository does not label it. Changing this list is a privacy
# setting: only the user edits it, never an agent.
[cloud]
allowlist = []

# API, WebSocket and web chat of the core (task 1.11). Loopback only: the
# history holds L2 in clear and there is no authentication yet. Access from
# the phone over the VPN comes with a proxy and authentication (task 1.13).
[server]
host = "127.0.0.1"
port = 7420

# Telegram (task 1.15, D-044): an external channel behind the gateway, at most
# L1; anything above arrives as a notice pointing to the web chat. Off while
# this section is absent. The token stays in the vault (pnpm vault:edit, key
# telegram-bot-token); `chats` lists the ids of the private chats the bot
# talks to. Changing it is a privacy setting: only the user edits it.
#
# [telegram]
# token = "vault://telegram-bot-token"
# chats = [123456789]
