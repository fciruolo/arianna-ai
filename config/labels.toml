# Privacy label rules by folder and source (docs/PRIVACY-POLICY-SPEC.md).
# Folder paths are relative to ARIANNA_HOME. The most specific rule wins, also
# when it lowers the label; a file that no rule contains is L2 (default-deny).
# A KB page header (`label:`) can raise its folder label, never lower it.
# Changing this file is a privacy setting: only the user edits it, never an agent.

# Development knowledge base with fake documents.
[[folder]]
path = "kb/public"
label = "L0"

[[folder]]
path = "kb/work"
label = "L1"

[[folder]]
path = "kb/private"
label = "L2"

# Real data lives under data/: private by default, secrets at the top.
[[folder]]
path = "data"
label = "L2"

[[folder]]
path = "data/vault"
label = "L3"

[[source]]
name = "web"
label = "L0"

[[source]]
name = "mail"
label = "L2"
