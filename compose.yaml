# Services that run in Docker (docs/DECISIONS.md, D-009 and D-028).
# Start it with `pnpm db:up`: scripts/compose.ts fills the variables below from
# config/arianna.toml. The defaults keep a plain `docker compose up` working too.
name: arianna

services:
  postgres:
    # Minor version and multi-arch digest pinned (D-028); update both together.
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ARIANNA_DB_USER:-arianna}
      # Read only when data/postgres is created. Always the development
      # default, for fake data only: before real data the owner changes it with
      # psql's \password and pnpm arianna:doctor checks it is refused (D-046). A real
      # password here would stay readable with `docker inspect`.
      POSTGRES_PASSWORD: arianna_dev
      POSTGRES_DB: ${ARIANNA_DB_NAME:-arianna}
    ports:
      # Loopback only: the database is never reachable from the network.
      - '127.0.0.1:${ARIANNA_DB_PORT:-54329}:5432'
    volumes:
      - ${ARIANNA_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first initialization the server listens on the Unix socket only.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
